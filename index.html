<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>A Private Memory</title>
<meta name="description" content="A private collection of memories." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Caveat:wght@500;600;700&family=Courier+Prime&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>

<button id="musicToggle" class="music-toggle" type="button" aria-label="Play background music">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M9 18V5l12-2v13" />
    <circle cx="6" cy="18" r="3" />
    <circle cx="18" cy="16" r="3" />
  </svg>
</button>

<div class="app">
  <div class="page-track" id="pageTrack">

    <!-- PAGE 1 — ENVELOPE LANDING -->
    <section class="page page--envelope paper-texture" data-page="1" aria-label="Cover — open the envelope" aria-hidden="false">
      <div class="envelope-scene">
        <p class="envelope-scene__title">for you</p>
        <div class="envelope" id="envelope1">
          <div class="envelope__body"></div>
          <div class="envelope__flap"></div>
          <button class="wax-seal" id="openSeal" type="button" aria-label="Break the wax seal to open the envelope">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 1 0-7.6 7.6l1.2 1.2L12 21l7.6-7.6 1.2-1.2a5.4 5.4 0 0 0 0-7.6z"/></svg>
          </button>
        </div>
        <p class="envelope-scene__hint">click the seal to open</p>
      </div>
    </section>

    <!-- PAGE 2 — PRIVATE NOTE -->
    <section class="page page--note paper-texture" data-page="2" aria-label="A private note" aria-hidden="true">
      <div class="note-layout">
        <div class="note-sheet">
          <p class="note-sheet__text" id="page2Note"></p>
        </div>
        <div class="note-photos" id="page2Photos"></div>
      </div>
    </section>

    <!-- PAGE 3 — MUSIC ROOM -->
    <section class="page page--music" data-page="3" aria-label="Music room">
      <div class="music-layout">
        <div>
          <p class="music-layout__heading">our songs</p>
          <div class="cassette-rack" id="cassetteRack" role="list" aria-label="Song playlist"></div>
        </div>
        <div class="lyric-sheet" id="lyricSheet" aria-live="polite"></div>
      </div>
    </section>

    <!-- PAGE 4 — TIMELINE -->
    <section class="page page--timeline paper-texture" data-page="4" aria-label="Timeline of memories">
      <div class="timeline-wrap">
        <p class="timeline-heading">along the way</p>
        <div class="timeline" id="timelineMount"></div>
      </div>
    </section>

    <!-- PAGE 5 — MEMORY ALBUM -->
    <section class="page page--gallery paper-texture" data-page="5" aria-label="Memory album">
      <div>
        <p class="gallery-heading">the memory album</p>
        <div class="gallery" id="galleryMount"></div>
      </div>
    </section>

    <!-- PAGE 6 — TIME CAPSULE -->
    <section class="page page--capsule" data-page="6" aria-label="Time capsule letter">
      <div class="capsule-scene">
        <p class="capsule-scene__title">a letter for later</p>

        <div class="envelope" id="capsuleEnvelope">
          <div class="envelope__body"></div>
          <div class="envelope__flap"></div>
          <button class="wax-seal" id="capsuleSeal" type="button" aria-label="Open the time capsule letter">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 1 0-7.6 7.6l1.2 1.2L12 21l7.6-7.6 1.2-1.2a5.4 5.4 0 0 0 0-7.6z"/></svg>
          </button>
        </div>

        <p class="capsule-countdown" id="capsuleCountdown" hidden></p>
        <p class="capsule-locked-message" id="capsuleLockedMessage" hidden></p>

        <div class="letter" id="capsuleLetter" hidden>
          <h2 class="letter__title" id="letterTitle"></h2>
          <p class="letter__body" id="letterBody"></p>
          <p class="letter__signoff" id="letterSignOff"></p>
        </div>
      </div>
    </section>

  </div>
</div>

<!-- Navigation controls -->
<nav class="book-nav" aria-label="Page navigation">
  <button class="nav-arrow" id="navPrev" type="button" aria-label="Previous page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
  </button>
  <ul class="dots" id="navDots" style="display:flex; list-style:none;">
    <li><button class="dot dot--active" data-index="0" aria-label="Go to page 1" aria-current="true"></button></li>
    <li><button class="dot" data-index="1" aria-label="Go to page 2" aria-current="false"></button></li>
    <li><button class="dot" data-index="2" aria-label="Go to page 3" aria-current="false"></button></li>
    <li><button class="dot" data-index="3" aria-label="Go to page 4" aria-current="false"></button></li>
    <li><button class="dot" data-index="4" aria-label="Go to page 5" aria-current="false"></button></li>
    <li><button class="dot" data-index="5" aria-label="Go to page 6" aria-current="false"></button></li>
  </ul>
  <button class="nav-arrow" id="navNext" type="button" aria-label="Next page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button>
</nav>

<!-- Shared lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <button class="lightbox__close" id="lightboxClose" type="button" aria-label="Close photo viewer">&times;</button>
  <button class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" type="button" aria-label="Previous photo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" fill="none" stroke-width="2"/></svg>
  </button>
  <figure class="lightbox__figure">
    <img id="lightboxImage" alt="" />
    <figcaption class="lightbox__caption" id="lightboxCaption"></figcaption>
  </figure>
  <button class="lightbox__nav lightbox__nav--next" id="lightboxNext" type="button" aria-label="Next photo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" fill="none" stroke-width="2"/></svg>
  </button>
</div>

<script src="./js/config.js"></script>
<script src="./js/utils.js"></script>
<script src="./js/audio.js"></script>
<script src="./js/navigation.js"></script>
<script src="./js/gallery.js"></script>
<script src="./js/timeline.js"></script>
<script src="./js/musicroom.js"></script>
<script src="./js/timecapsule.js"></script>
<script src="./js/main.js"></script>
</body>
</html>
